[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tetris"
version = "0.1.0"
description = "Python pygame Tetris with an embedded DQN AI agent."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Frederic Matray" }]
keywords = ["tetris", "pygame", "dqn", "reinforcement-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Pygame",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment :: Arcade",
]
dependencies = [
    "pygame>=2.5.0",
    "numpy>=1.24.0",
    "torch>=2.0",
    "matplotlib>=3.7.0",
    "mido>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.6",
    "zuban>=0.9",
]

[project.scripts]
tetris = "tetris:run"

[tool.setuptools.packages.find]
include = ["tetris*"]

[tool.setuptools.package-data]
tetris = ["../media/*.mid"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
# ponytail: pre-existing I001/DTZ005/PLR0402 diagnostics are known and not our concern
ignore = ["I001", "DTZ005", "PLR0402"]

[tool.pytest.ini_options]
testpaths = ["tests"]